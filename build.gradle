plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

javafx {
    version = '20'
    modules = [ 'javafx.controls', 'javafx.graphics' ]
}

application {
    mainClass = 'chatfx.ClientFX'
}
